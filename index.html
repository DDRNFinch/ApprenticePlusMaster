<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#58b51f">
  <meta name="description" content="Apprentice+ local evidence pack builder">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=1.4">
  <title>Apprentice+</title>
</head>
<body>
  <noscript><div class="noscript">Apprentice+ requires JavaScript.</div></noscript>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <!-- Isolated notification bell: intentionally outside #app so Apprentice+ renders cannot replace it. -->
  <button type="button" id="notificationBell" class="notification-bell no-print" aria-label="Open notifications" aria-controls="notificationBellPanel" aria-expanded="false">
    <span class="notification-bell-icon" aria-hidden="true">🔔</span>
    <span class="notification-bell-count" aria-label="1 unread notification">1</span>
  </button>

  <div id="notificationBellBackdrop" class="notification-bell-backdrop no-print" hidden></div>
  <section id="notificationBellPanel" class="notification-bell-panel no-print" role="dialog" aria-modal="true" aria-labelledby="notificationBellTitle" hidden>
    <div class="notification-bell-handle" aria-hidden="true"></div>
    <header class="notification-bell-header">
      <div>
        <p class="notification-bell-kicker">Apprentice+</p>
        <h2 id="notificationBellTitle">Notifications</h2>
      </div>
      <button type="button" id="notificationBellClose" class="notification-bell-close" aria-label="Close notifications">×</button>
    </header>
    <div class="notification-bell-list" id="notificationBellList">
      <article class="notification-bell-item unread" data-notification-id="welcome">
        <span class="notification-bell-item-icon" aria-hidden="true">🔔</span>
        <div>
          <strong>Notifications are ready</strong>
          <p>This bell will show important Apprentice+ messages without changing the app logo or main navigation.</p>
          <small>Just now</small>
        </div>
      </article>
    </div>
  </section>

  <script src="qrcode-browser.js?v=1.4.0"></script>
  <script src="pdf-generator.js?v=1.4.0"></script>
  <script src="specification-sheet.js?v=1.4.0"></script>
  <script src="functional-skills-bank.js?v=1.4.0"></script>
  <script src="trade-courses-bank.js?v=1.4.0"></script>
  <script src="app.js?v=1.4"></script>
  <script>
  (() => {
    const bell = document.getElementById('notificationBell');
    const panel = document.getElementById('notificationBellPanel');
    const backdrop = document.getElementById('notificationBellBackdrop');
    const closeButton = document.getElementById('notificationBellClose');
    const list = document.getElementById('notificationBellList');
    const count = bell.querySelector('.notification-bell-count');
    if (!bell || !panel || !backdrop || !closeButton || !list || !count) return;

    const deletedKey = 'apprenticeplus.notifications.deleted.v1';
    let deleted = [];
    try { deleted = JSON.parse(localStorage.getItem(deletedKey) || '[]'); } catch { deleted = []; }
    list.querySelectorAll('[data-notification-id]').forEach(item => {
      if (deleted.includes(item.dataset.notificationId)) item.remove();
    });
    const updateCount = () => {
      const total = list.querySelectorAll('.notification-bell-item').length;
      count.textContent = String(total);
      count.hidden = total === 0;
      if (!total && !list.querySelector('.notification-bell-empty')) {
        list.insertAdjacentHTML('beforeend', '<div class="notification-bell-empty"><strong>No notifications</strong><p>New Apprentice+ messages will appear here.</p></div>');
      }
    };
    const deleteNotification = item => {
      const id = item.dataset.notificationId;
      if (id && !deleted.includes(id)) {
        deleted.push(id);
        try { localStorage.setItem(deletedKey, JSON.stringify(deleted)); } catch {}
      }
      item.classList.add('deleting');
      window.setTimeout(() => { item.remove(); updateCount(); }, 180);
    };
    const attachSwipe = item => {
      let startX = 0, currentX = 0, dragging = false;
      const reset = () => { dragging = false; item.classList.remove('swiping'); item.style.transform = ''; };
      item.addEventListener('pointerdown', event => {
        if (event.pointerType === 'mouse' && event.button !== 0) return;
        startX = currentX = event.clientX; dragging = true; item.classList.add('swiping');
        try { item.setPointerCapture(event.pointerId); } catch {}
      });
      item.addEventListener('pointermove', event => {
        if (!dragging) return;
        currentX = event.clientX;
        const dx = Math.min(0, currentX - startX);
        item.style.transform = `translateX(${Math.max(-120, dx)}px)`;
      });
      item.addEventListener('pointerup', () => {
        if (!dragging) return;
        const dx = currentX - startX;
        if (dx < -72) deleteNotification(item); else reset();
      });
      item.addEventListener('pointercancel', reset);
    };
    list.querySelectorAll('.notification-bell-item').forEach(attachSwipe);
    updateCount();

    const openNotifications = () => {
      panel.hidden = false;
      backdrop.hidden = false;
      bell.setAttribute('aria-expanded', 'true');
      document.body.classList.add('notification-panel-open');
      requestAnimationFrame(() => panel.classList.add('open'));
    };
    const closeNotifications = () => {
      panel.classList.remove('open');
      bell.setAttribute('aria-expanded', 'false');
      document.body.classList.remove('notification-panel-open');
      window.setTimeout(() => { panel.hidden = true; backdrop.hidden = true; }, 180);
    };

    bell.addEventListener('click', openNotifications);
    closeButton.addEventListener('click', closeNotifications);
    backdrop.addEventListener('click', closeNotifications);
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !panel.hidden) closeNotifications();
    });
  })();
  </script>

</body>
</html>
